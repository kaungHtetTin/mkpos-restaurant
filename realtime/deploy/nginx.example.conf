# Example for a VPS with an existing Let's Encrypt certificate.
# Managed Node.js hosting can configure this reverse proxy/TLS in its control panel.
server {
    listen 443 ssl;
    server_name restaurant-socket.mkposmyanmar.com;
    ssl_certificate /etc/letsencrypt/live/restaurant-socket.mkposmyanmar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurant-socket.mkposmyanmar.com/privkey.pem;

    location /socket {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location /publish {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name restaurant-socket.mkposmyanmar.com;
    return 301 https://$host$request_uri;
}
